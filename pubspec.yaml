name: website_wrapper
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  webview_flutter: ^4.7.0
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  rename: ^3.0.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - images/
